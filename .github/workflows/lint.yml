name: Quality checks
on:
  push:
    branches: [ "codex/macos27-compat" ]
    paths:
      - ".github/workflows/**"
      - ".swiftlint.yml"
      - "Ice/**"
      - "Ice.xcodeproj/**"
      - "Packages/**"
      - "Tests/**"
      - "Scripts/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".swiftlint.yml"
      - "Ice/**"
      - "Ice.xcodeproj/**"
      - "Packages/**"
      - "Tests/**"
      - "Scripts/**"
jobs:
  swiftlint:
    name: SwiftLint diagnostics
    if: '!github.event.pull_request.merged'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: Ice

  release-scripts:
    name: Release script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and test release scripts
        run: |
          python3 -m py_compile Scripts/create-appcast.py Scripts/verify-release.py Scripts/test-verify-release.py
          python3 Scripts/test-verify-release.py

  macos-verification:
    name: macOS build and policy tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic policy tests
        run: |
          ./Scripts/test-regressions.sh
      - name: Build unsigned Debug app
        env:
          CONFIGURATION: Debug
          DEVELOPMENT_TEAM: ""
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          ./Scripts/build-local.sh CODE_SIGNING_ALLOWED=NO
