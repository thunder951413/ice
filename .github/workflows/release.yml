name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Release
        run: |
          xcodebuild clean build \
            -project Ice.xcodeproj \
            -scheme Ice \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.jordanbaird.Ice

      - name: Package App
        run: |
          APP_PATH=$(find build -name "Ice.app" -type d | head -1)
          ditto -c -k --keepParent "$APP_PATH" Ice.zip
          echo "app_path=$APP_PATH" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ice ${{ github.ref_name }}
          body: |
            ## Ice ${{ github.ref_name }}

            Download `Ice.zip` and extract to your Applications folder.
          files: Ice.zip
          draft: true
          generate_release_notes: true
